<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3efe6">
  <title>Xylo — Authentication</title>
  <style>
    :root{color-scheme:light;--paper:#f3efe6;--ivory:#faf8f2;--ink:#24231f;--muted:#77766e;--line:#d7d1c5;--accent:#873f32}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font:15px/1.7 Arial,Helvetica,sans-serif;display:grid;place-items:center;padding:28px}
    main{width:min(100%,620px);padding:clamp(28px,6vw,58px);background:var(--ivory);border:1px solid var(--line)}
    .eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
    h1{font:clamp(40px,7vw,62px)/1.02 Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:-.055em;margin:22px 0 16px}
    p{color:var(--muted);max-width:460px;font-size:13px}
    a{display:inline-block;margin-top:20px;padding:13px 17px;background:var(--accent);color:#fff;text-decoration:none;font-size:12px}
    a:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Xylo · Accounting workspace</div>
    <h1>One clear place for your business.</h1>
    <p>The dedicated authentication experience is not available in this build yet. You can continue to the existing Xylo workspace below.</p>
    <a href="/">Continue to Xylo <span aria-hidden="true">→</span></a>
  </main>
</body>
</html>
