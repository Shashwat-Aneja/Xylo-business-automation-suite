name: Resend adapter tests

on:
  push:
    branches:
      - feature/xylo-auth-experience
  pull_request:
    branches:
      - feature/xylo-auth-experience

permissions:
  contents: read

jobs:
  resend-mail-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Resend adapter unit tests
        run: python -m unittest backend.tests.test_resend_mail backend.tests.test_email_templates backend.tests.test_invoice_mail -v
